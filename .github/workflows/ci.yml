name: CI Quality Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/planner?schema=public"
  NEXTAUTH_SECRET: "ci-secret-for-testing-123456789012"
  NEXTAUTH_URL: "http://localhost:3000"

jobs:
  quality-gate:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Database Schema (if present)
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            npx prisma validate
            npx prisma generate
          fi

      - name: Type Check (TypeScript)
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit
          fi

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Automated Agent Health Check
        run: |
          if [ -f "scripts/agent-doctor.mjs" ]; then
            node scripts/agent-doctor.mjs
          fi

      - name: Run Unit / Component Tests
        run: npm run test:unit --if-present
        env:
          CI: "true"

      - name: Production Build
        run: npm run build --if-present
