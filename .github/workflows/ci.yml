name: Continuous Integration & Type Safety Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://mock:mock@localhost:5432/mockdb"
      DATABASE_URL_UNPOOLED: "postgresql://mock:mock@localhost:5432/mockdb"
      DIRECT_URL: "postgresql://mock:mock@localhost:5432/mockdb"
      NEXTAUTH_SECRET: "ci-secret-for-testing-123456789"
      NEXTAUTH_URL: "http://localhost:3000"
      TZ: "UTC"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Unit & Integration Test Suite
        run: npm run test:unit
