name: ⚡ CI Auto-Repair (Autonomous)

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The failed workflow run ID to repair'
        required: true
      branch:
        description: 'Branch to push the fix to'
        required: false
        default: 'main'

concurrency:
  group: ci-auto-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Gate: Only run if a workflow just FAILED ─────────────────────────────
  detect-failure:
    name: 🔍 Detect Failing CI Run
    runs-on: ubuntu-latest
    # For workflow_run event: only trigger if the triggering run actually failed
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       !contains(github.event.workflow_run.name, 'Auto-Repair'))
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      branch: ${{ steps.resolve.outputs.branch }}
      should_repair: ${{ steps.resolve.outputs.should_repair }}
    steps:
      - name: Resolve Failed Run Details
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_id=${{ github.event.inputs.run_id }}" >> $GITHUB_OUTPUT
            echo "branch=${{ github.event.inputs.branch || 'main' }}" >> $GITHUB_OUTPUT
            echo "should_repair=true" >> $GITHUB_OUTPUT
          else
            FAILED_RUN_ID="${{ github.event.workflow_run.id }}"
            FAILED_BRANCH="${{ github.event.workflow_run.head_branch }}"
            echo "run_id=$FAILED_RUN_ID" >> $GITHUB_OUTPUT
            echo "branch=$FAILED_BRANCH" >> $GITHUB_OUTPUT
            echo "should_repair=true" >> $GITHUB_OUTPUT
            echo "🚨 Detected failed CI run #$FAILED_RUN_ID on branch: $FAILED_BRANCH"
          fi

  # ─── Repair Job: Autonomous Code Fixer ────────────────────────────────────
  repair:
    name: 🔧 AI-Powered Root Cause Repair
    needs: detect-failure
    if: needs.detect-failure.outputs.should_repair == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      checks: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect-failure.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/mockdb?schema=public' }}

      - name: Generate Database Client (if present)
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            npx prisma generate || true
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/mockdb?schema=public' }}

      - name: 🤖 Run AI Root-Cause Diagnosis & Auto-Repair
        run: |
          echo "🔍 Analyzing failed CI run #${{ needs.detect-failure.outputs.run_id }}..."
          node scripts/ci-auto-repair.mjs "${{ needs.detect-failure.outputs.run_id }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_HEAD_REF: ${{ needs.detect-failure.outputs.branch }}
          GITHUB_REF_NAME: ${{ needs.detect-failure.outputs.branch }}
          FAILED_RUN_ID: ${{ needs.detect-failure.outputs.run_id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 📢 Notify Discord if Unresolved Failure Detected
        if: failure()
        uses: actions/github-script@v9
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const runId = '${{ needs.detect-failure.outputs.run_id }}';
            const branch = '${{ needs.detect-failure.outputs.branch }}';

            // Check if ci-auto-repair.mjs already notified Discord
            let alreadyNotified = false;
            try {
              const fs = await import('fs');
              if (fs.existsSync('.agents/repair-status.json')) {
                const status = JSON.parse(fs.readFileSync('.agents/repair-status.json', 'utf8'));
                if (status.notified) alreadyNotified = true;
              }
            } catch {}

            // Send Discord notification without creating spam GitHub issues
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (webhook && !alreadyNotified) {
              try {
                await fetch(webhook, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    username: '🔧 CI Auto-Repair Bot',
                    avatar_url: 'https://cdn-icons-png.flaticon.com/512/1006/1006771.png',
                    embeds: [{
                      title: `🔴 [UNRESOLVED CI FAILURE] • ${context.repo.repo}`,
                      description: `CI Auto-Repair detected an unresolvable failure on branch \`${branch}\`.\n`,
                      color: 15158332,
                      fields: [
                        {
                          name: '🔗 Action Links',
                          value: `• **Failed Run:** [View GitHub Actions #${runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId})\n` +
                                 `• **Branch:** \`${branch}\`\n` +
                                 `• **Repository:** [${context.repo.owner}/${context.repo.repo}](https://github.com/${context.repo.owner}/${context.repo.repo})`,
                          inline: false
                        }
                      ],
                      footer: { text: 'Agent Second Brain • CI Auto-Repair' },
                      timestamp: new Date().toISOString()
                    }]
                  })
                });
              } catch (e) {}
            }
