name: UI/UX & Accessibility E2E

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  playwright-e2e:
    name: Playwright WCAG & Responsive Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate & Generate Database Schema (if present)
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            npx prisma generate
          fi

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Automated UX/UI & WCAG Tests
        run: npm run test:ui --if-present
        env:
          CI: "true"
          DATABASE_URL: "file:./dev.db"

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
