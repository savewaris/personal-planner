name: Autonomous Browser & AI Vision Quality Gate

on:
  pull_request:
    branches: [ main, master ]
  deployment_status:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Specific deployment URL to audit (optional, defaults to production)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-ai-audit:
    name: Headless Browser & Gemini AI Visual Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      pull-requests: write
      statuses: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Initialize Artifact Directories
        run: mkdir -p .agents/reports .agents/audit-screenshots

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Database Client (if present)
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            npx prisma generate
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/mockdb?schema=public' }}

      - name: Determine Target URL
        id: determine-url
        run: |
          # Priority:
          # 1. Manual workflow_dispatch input
          # 2. Successful deployment_status event URL
          # 3. PRODUCTION_URL secret (always-live, never behind auth wall)
          if [ -n "${{ github.event.inputs.target_url }}" ]; then
            TARGET="${{ github.event.inputs.target_url }}"
          elif [ "${{ github.event_name }}" = "deployment_status" ] && [ "${{ github.event.deployment_status.state }}" = "success" ]; then
            TARGET="${{ github.event.deployment_status.target_url }}"
          elif [ -n "${{ secrets.PRODUCTION_URL }}" ]; then
            TARGET="${{ secrets.PRODUCTION_URL }}"
            echo "ℹ️ Using PRODUCTION_URL secret: $TARGET"
          else
            TARGET="local"
          fi
          echo "url=$TARGET" >> $GITHUB_OUTPUT
          echo "🎯 Audit Target: $TARGET"

      - name: Start Local Production Server (Fallback)
        run: |
          npm run build --if-present
          npm run start --if-present &
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "✅ Local server ready"
              break
            fi
            sleep 1
          done
        env:
          PORT: 3000
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://mock:mock@localhost:5432/mockdb' }}

      - name: Resolve Final Audit URL
        id: resolve-url
        run: |
          if [ "${{ steps.determine-url.outputs.url }}" = "local" ]; then
            echo "url=http://localhost:3000" >> $GITHUB_OUTPUT
          else
            echo "url=${{ steps.determine-url.outputs.url }}" >> $GITHUB_OUTPUT
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Execute Interactive Headless Browser Audit (All Routes)
        run: |
          echo "🚀 Auditing Target URL: ${{ steps.resolve-url.outputs.url }}"
          node scripts/agent-ui-audit.mjs --url "${{ steps.resolve-url.outputs.url }}" --interactive
        env:
          CI: "true"
          AUDIT_SKIP_THIRD_PARTY_ERRORS: "true"

      - name: Execute Gemini Multimodal AI Visual Audit & Sentry
        run: |
          node scripts/agent-vision-audit.mjs --notify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post AI Diagnosis to Pull Request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = path.join(process.cwd(), '.agents', 'reports', 'ai-vision-diagnosis.md');
            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### 🤖 Autonomous AI Visual & Runtime Audit Report\n\n${body}`
              });
            }

      - name: Autonomous Auto-Merge to Main (Quality Gate Passed)
        if: github.event_name == 'pull_request' && success()
        run: |
          echo "🚀 Quality Gate 100% Passed. Auto-merging PR into main..."
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Visual Audit Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-audit-evidence
          path: |
            .agents/reports/
            .agents/audit-screenshots/
          if-no-files-found: ignore
          retention-days: 14
