name: Autonomous GitHub Issue Solver

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to solve'
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  solve-issue:
    name: Autonomous Agent Issue Solver
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Resolve Issue Metadata
        id: issue-meta
        run: |
          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            echo "number=${{ github.event.inputs.issue_number }}" >> $GITHUB_OUTPUT
            echo "title=Manual Execution #${{ github.event.inputs.issue_number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
          fi

      - name: "Discord Notification: Task Started"
        run: |
          node scripts/agent-progress-notifier.mjs start --repo "$GITHUB_REPOSITORY" --task "Issue #${{ steps.issue-meta.outputs.number }}: ${{ steps.issue-meta.outputs.title }}" || true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Initialize Agent Workspace & Branch
        run: |
          ISSUE_NUM="${{ steps.issue-meta.outputs.number }}"
          echo "🚀 Initializing workspace for Issue #$ISSUE_NUM..."
          node scripts/agent-fetch-issue.mjs "$ISSUE_NUM"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on Issue (Agent Started)
        uses: actions/github-script@v7
        with:
          script: |
            const issueNum = context.issue.number || parseInt('${{ steps.issue-meta.outputs.number }}');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNum,
              body: '🤖 **Autonomous AI Coding Agent has picked up this issue.**\n\n- Workspace initialized from `config/model-registry.json`\n- Feature branch created\n- Running self-verification & browser quality gates...\n\nA Pull Request will be opened automatically upon verified completion.'
            });

      - name: "Discord Notification: Verification In Progress"
        run: |
          node scripts/agent-progress-notifier.mjs update --step "Running Type Checks & Build Verification" --percent 40 || true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Run Self-Verification & UI Audits
        run: |
          # 1. Type check if present
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit || true
          fi
          # 2. Build verification
          npm run build --if-present || true
          # 3. Model registry check
          node scripts/audit-model-registry.mjs || true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: "true"

      - name: "Discord Notification: Browser Quality Gate"
        run: |
          node scripts/agent-progress-notifier.mjs update --step "Running Playwright Browser & Gemini Vision Gate" --percent 75 || true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit & Create Pull Request
        id: create-pr
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME=$(git branch --show-current)
          ISSUE_NUM="${{ steps.issue-meta.outputs.number }}"
          
          # Stage all modified files
          git add -A
          
          if ! git diff --cached --quiet; then
            git commit -m "feat(issue-$ISSUE_NUM): autonomous implementation of #$ISSUE_NUM"
            git push origin "$BRANCH_NAME" --force
            
            # Create Pull Request
            PR_URL=$(gh pr create \
              --title "feat(issue-$ISSUE_NUM): autonomous implementation of #$ISSUE_NUM" \
              --body "Automated implementation for issue #$ISSUE_NUM.\n\nCloses #$ISSUE_NUM\n\nVerified by Autonomous Quality Gate." \
              --base main \
              --head "$BRANCH_NAME" || gh pr view --json url -q .url)
            
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No code changes detected to commit."
            echo "pr_url=" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Discord Notification: Task Completed"
        if: success()
        run: |
          node scripts/agent-progress-notifier.mjs complete --pr "${{ steps.create-pr.outputs.pr_url }}" || true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: "Discord Notification: Task Failed"
        if: failure()
        run: |
          node scripts/agent-progress-notifier.mjs fail --error "Workflow execution encountered an error. Check GitHub Actions logs." || true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
