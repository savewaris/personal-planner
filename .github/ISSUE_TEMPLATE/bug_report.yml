name: 🐛 Bug Report
description: Report a reproducible bug or issue
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🐛 Bug Report
        Please provide reproducible information to help fix this issue quickly.
  - type: textarea
    id: description
    attributes:
      label: 📝 Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When clicking the save button, the application crashes with status 500."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 🔄 Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Navigate to '/settings'
        2. Click on 'Profile Picture'
        3. Upload invalid PNG
        4. See error in browser console
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 🎯 Expected Behavior
      description: What did you expect to happen instead?
      placeholder: "A friendly validation toast error should display indicating invalid dimensions."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 💻 Environment Details
      description: OS, Browser, Node version, or device details.
      placeholder: "Node v20.x, Windows 11, Chrome latest"
    validations:
      required: false
