name: ✨ Feature Request
description: Propose a new feature or user-facing enhancement
title: "[FEAT]: "
labels: ["enhancement", "feature"]
body:
  - type: markdown
    attributes:
      value: |
        ### 💡 Feature Request
        Thank you for suggesting a new idea!
  - type: textarea
    id: problem
    attributes:
      label: 🧐 Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: "A clear and concise description of what the problem is."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 🚀 Proposed Solution
      description: A clear and concise description of what you want to happen.
      placeholder: "Describe the desired user experience or architecture change."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false
